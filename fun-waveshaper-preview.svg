<linearGradient id="panel" x2="1" y2=".9"><stop stop-color="#0e2b31"/><stop offset="1" stop-color="#173e3b"/></linearGradient>
<radialGradient id="mist" cx=".25" cy=".2" r=".85"><stop stop-color="#789f91" stop-opacity=".2"/><stop offset="1" stop-color="#789f91" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="150" height="90" patternUnits="userSpaceOnUse"><path d="M 150 0 L 0 0 0 90" fill="none" stroke="#8bada5" stroke-opacity=".15" stroke-width="1"/></pattern>
</defs>
