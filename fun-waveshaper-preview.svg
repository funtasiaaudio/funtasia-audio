<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">FUN WaveShaper — curve distortion</title>
<desc id="desc">An illustrated transfer curve with controls for PRE, POST, MIX and oversampling.</desc>
