<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
<title id="title">FUN EQ — parametric equalizer</title>
<desc id="desc">Decorative spectrum curve visual inspired by the FUN EQ interface.</desc>
<defs>
  <radialGradient id="bg" cx=".50" cy=".35" r=".95"><stop stop-color="#173c3a"/><stop offset="1" stop-color="#081716"/></radialGradient>
